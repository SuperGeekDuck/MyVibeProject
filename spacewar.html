<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spacewar! 太空大战</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#000;
    color:#0f0;
    font-family: 'Courier New', monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
    user-select:none;
  }
  #wrap { position:relative; margin-top:10px; }
  canvas { display:block; background:#000; border:1px solid #2a2a2a; }
  #title {
    text-align:center;
    font-size:18px;
    letter-spacing:4px;
    padding:8px 0 4px;
    text-shadow:0 0 8px #0f0;
  }
  #controls {
    width:100%;
    display:flex;
    justify-content:space-between;
    font-size:13px;
    padding:8px 4px;
  }
  .p1 { color:#0ff; }
  .p2 { color:#f0f; }
  #status { text-align:center; font-size:14px; padding:6px; min-height:22px; }
  kbd {
    border:1px solid #555;
    border-radius:3px;
    padding:0 4px;
    background:#111;
    font-size:11px;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="title">SPACEWAR!</div>
  <canvas id="game" width="900" height="700"></canvas>
  <div id="status">按 空格键 开始</div>
  <div id="controls">
    <div class="p1">
      <b>飞船1 (青色)</b><br>
      <kbd>W</kbd> 推进 &nbsp; <kbd>A</kbd>/<kbd>D</kbd> 旋转<br>
      <kbd>F</kbd> 开火 &nbsp; <kbd>C</kbd> 定向导弹
    </div>
    <div class="p2">
      <b>飞船2 (洋红)</b><br>
      <kbd>↑</kbd> 推进 &nbsp; <kbd>←</kbd>/<kbd>→</kbd> 旋转<br>
      <kbd>.</kbd> 开火 &nbsp; <kbd>,</kbd> 定向导弹
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const CX = W/2, CY = H/2, R = 150;          // 中心恒星
const status = document.getElementById('status');

// ---------- 恒星背景（随机但固定种子） ----------
const stars = [];
let seed = 12345;
function rnd() { seed = (seed * 16807) % 2147483647; return seed/2147483647; }
for (let i=0;i<220;i++){
  stars.push({ x:rnd()*W, y:rnd()*H, r:rnd()*1.5+0.3, b: rnd()*0.6+0.3 });
}

// ---------- 物理常量 ----------
const G = 180;          // 引力强度
const STAR_R = R;

// ---------- 飞船 ----------
function mkShip(color, x, y){
  return {
    x, y, vx:0, vy:0, ang:0,
    thrust:false, acc:260, maxv:340,
    turn:3.2, fireCd:0, missileCd:0,
    hp:1, color, alive:true, respawn:0
  };
}
let p1 = mkShip('#0ff', CX-160, CY);
let p2 = mkShip('#f0f', CX+160, CY);

// ---------- 射击物 ----------
let bullets = [];   // 光子鱼雷
let missiles = [];  // 制导导弹
let parts = [];     // 爆炸粒子

function fire(ship){
  if (ship.fireCd > 0) return;
  bullets.push({
    x: ship.x + Math.cos(ship.ang)*22,
    y: ship.y + Math.sin(ship.ang)*22,
    vx: ship.vx + Math.cos(ship.ang)*560,
    vy: ship.vy + Math.sin(ship.ang)*560,
    life: 2.2, owner: ship
  });
  ship.fireCd = 0.35;
}

function launchMissile(ship){
  if (ship.missileCd > 0 || !enemy(ship)) return;
  missiles.push({
    x: ship.x + Math.cos(ship.ang)*22,
    y: ship.y + Math.sin(ship.ang)*22,
    vx: ship.vx + Math.cos(ship.ang)*260,
    vy: ship.vy + Math.sin(ship.ang)*260,
    life: 5, owner: ship, turn:4
  });
  ship.missileCd = 2.5;
}

function enemy(ship){ return ship===p1 ? p2 : p1; }

// ---------- 输入 ----------
const keys = {};
window.addEventListener('keydown', e=>{
  keys[e.key] = true;
  const k = e.key;
  if (k===' '){ e.preventDefault(); if(!running) start(); }
  if (k==='r' || k==='R') reset();
});
window.addEventListener('keyup', e=>{ keys[e.key]=false; });

function control(ship, forward,left,right,fireKey,missKey){
  if(!ship.alive) return;
  if(keys[forward]) ship.thrust=true; else ship.thrust=false;
  if(keys[left])  ship.ang -= ship.turn*dt;
  if(keys[right]) ship.ang += ship.turn*dt;
  if(keys[fireKey]) fire(ship);
  if(keys[missKey]) launchMissile(ship);
}

// ---------- 物理更新 ----------
function grav(ox,oy,obj,dt){
  let dx=CX-obj.x, dy=CY-obj.y;
  let d=Math.hypot(dx,dy);
  if(d<R){ d=R; }// 核心吸力恒定，防止吸进中心
  const a = G/(d*d);
  obj.vx += (dx/d)*a*dt;
  obj.vy += (dy/d)*a*dt;
}

function updateShip(ship,dt){
  if(!ship.alive){
    ship.respawn-=dt;
    if(ship.respawn<=0){ ship.alive=true; ship.x=CX-160; ship.y=CY; ship.vx=0; ship.vy=0; }
    return;
  }
  if(ship.thrust){
    ship.vx += Math.cos(ship.ang)*ship.acc*dt;
    ship.vy += Math.sin(ship.ang)*ship.acc*dt;
  }
  const sp=Math.hypot(ship.vx,ship.vy);
  if(sp>ship.maxv){ ship.vx=ship.vx/sp*ship.maxv; ship.vy=ship.vy/sp*ship.maxv; }
  grav(0,0,ship,dt);
  ship.x+=ship.vx*dt; ship.y+=ship.vy*dt;
  // 环绕
  if(ship.x< -40) ship.x+=W+80; else if(ship.x>W+40) ship.x-=W+80;
  if(ship.y< -40) ship.y+=H+80; else if(ship.y>H+40) ship.y-=H+80;
  ship.fireCd-=dt; ship.missileCd-=dt;
  // 撞上恒星
  if(Math.hypot(ship.x-CX,ship.y-CY)<R+14) kill(ship);
}

function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    grav(0,0,b,dt);
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if(b.life<=0 || Math.hypot(b.x-CX,b.y-CY)<R+4){ bullets.splice(i,1); continue; }
    // 命中
    [p1,p2].forEach(s=>{
      if(s!==b.owner && s.alive && Math.hypot(b.x-s.x,b.y-s.y)<16){
        kill(s); bullets.splice(i,1);
      }
    });
  }
}

function updateMissiles(dt){
  for(let i=missiles.length-1;i>=0;i--){
    const m=missiles[i];
    // 追踪目标
    const t=enemy(m.owner);
    if(t.alive){
      const want=Math.atan2(t.y-m.y,t.x-m.x);
      let diff=want-m.ang;
      while(diff>Math.PI)diff-=2*Math.PI;
      while(diff<-Math.PI)diff+=2*Math.PI;
      const maxT=m.turn*dt;
      m.ang += Math.max(-maxT,Math.min(maxT,diff));
    }
    m.vx += Math.cos(m.ang)*300*dt;
    m.vy += Math.sin(m.ang)*300*dt;
    grav(0,0,m,dt);
    m.x+=m.vx*dt; m.y+=m.vy*dt; m.life-=dt;
    if(m.life<=0){ explode(m.x,m.y); missiles.splice(i,1); continue; }
    [p1,p2].forEach(s=>{
      if(s!==m.owner && s.alive && Math.hypot(m.x-s.x,m.y-s.y)<16){
        kill(s); explode(m.x,m.y); missiles.splice(i,1);
      }
    });
  }
}

function kill(ship){
  if(!ship.alive) return;
  explode(ship.x,ship.y);
  ship.alive=false;
  ship.respawn=2.5;
}

function explode(x,y){
  for(let i=0;i<26;i++){
    const a=Math.random()*Math.PI*2, sp=Math.random()*220+40;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.7});
  }
}

function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vx*=0.98; p.vy*=0.98; p.life-=dt;
    if(p.life<=0) parts.splice(i,1);
  }
}

// ---------- 渲染 ----------
function drawStar(){
  const g=ctx.createRadialGradient(CX,CY,5,CX,CY,R);
  g.addColorStop(0,'#fff'); g.addColorStop(0.3,'#ffd');
  g.addColorStop(0.7,'#fa0'); g.addColorStop(1,'rgba(255,120,0,0)');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.fill();
}

function drawShip(s){
  if(!s.alive) return;
  ctx.save();
  ctx.translate(s.x,s.y); ctx.rotate(s.ang);
  ctx.strokeStyle=s.color; ctx.lineWidth=2; ctx.shadowColor=s.color; ctx.shadowBlur=10;
  ctx.beginPath();
  ctx.moveTo(20,0); ctx.lineTo(-14,-13); ctx.lineTo(-6,0); ctx.lineTo(-14,13);
  ctx.closePath(); ctx.stroke();
  if(s.thrust){
    ctx.strokeStyle='#ff0'; ctx.beginPath();
    ctx.moveTo(-6,0); ctx.lineTo(-22,Math.sin(Date.now()/50)*4);
    ctx.stroke();
  }
  ctx.restore();
}

function drawBullets(){
  ctx.shadowBlur=0;
  ctx.fillStyle='#fff';
  bullets.forEach(b=>{ ctx.beginPath(); ctx.arc(b.x,b.y,2.5,0,Math.PI*2); ctx.fill(); });
  ctx.fillStyle='#f80';
  missiles.forEach(m=>{ ctx.beginPath(); ctx.arc(m.x,m.y,4,0,Math.PI*2); ctx.fill(); });
}

function drawParts(){
  ctx.shadowBlur=0;
  parts.forEach(p=>{
    const a=p.life/0.7;
    ctx.fillStyle=`rgba(255,165,0,${a})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,3*a,0,Math.PI*2); ctx.fill();
  });
}

// ---------- 主循环 ----------
let running=false, last=0, dt=0;
function loop(t){
  requestAnimationFrame(loop);
  dt=Math.min((t-last)/1000,0.033); last=t;
  if(!running) return;
  if(keys[' ']){ /* 已处理 */ }

  control(p1,'w','a','d','f','c');
  control(p2,'ArrowUp','ArrowLeft','ArrowRight','.','');

  updateShip(p1,dt); updateShip(p2,dt);
  updateBullets(dt); updateMissiles(dt); updateParts(dt);

  // 渲染
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{ ctx.fillStyle=`rgba(255,255,255,${s.b})`; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); });
  drawStar();
  drawShip(p1); drawShip(p2);
  drawBullets(); drawParts();

  const hits=[];
  if(!p1.alive) hits.push('P1 被击毁，2.5秒后重生');
  if(!p2.alive) hits.push('P2 被击毁，2.5秒后重生');
  status.textContent = hits.join('  |  ') || ' ';
}

function start(){ running=true; last=performance.now(); status.textContent='对战开始！R 重置'; }
function reset(){
  p1 = mkShip('#0ff', CX-160, CY);
  p2 = mkShip('#f0f', CX+160, CY);
  bullets=[]; missiles=[]; parts=[];
  status.textContent=running?'已重置':'按 空格键 开始';
}

requestAnimationFrame(t=>{ last=t; requestAnimationFrame(loop); });
</script>
</body>
</html>
